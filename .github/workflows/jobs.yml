name: WiCS Opportunities

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wics-opportunities
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for new opportunities
        env:
          INTERNSHIP_WEBHOOK: ${{ secrets.INTERNSHIP_WEBHOOK }}
          NEW_GRAD_WEBHOOK: ${{ secrets.NEW_GRAD_WEBHOOK }}
          MAX_POSTS_PER_CHANNEL: '15'
        run: python jobs.py

      - name: Save posted links even after a partial failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seen_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update tracked opportunity links'
            git push
          fi
